name: AntiGem Standard Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/antigem-standard-release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standard Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-Debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
